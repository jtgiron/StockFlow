name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  client:
    name: client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

  backend:
    name: backend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://stockflow:stockflow@localhost:5432/stockflow_test
      JWT_SECRET: test-secret-do-not-use-in-prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Initialize schema
        working-directory: ${{ github.workspace }}
        run: |
          export PGPASSWORD=stockflow
          for f in init-scripts/*.sql; do
            echo "Applying $f"
            psql -h localhost -U stockflow -d stockflow_test -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in backend/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U stockflow -d stockflow_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: pnpm test
